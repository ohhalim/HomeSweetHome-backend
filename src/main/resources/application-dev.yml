server:
  port: 8080
  tomcat:
    threads:
      max: 250
      min-spare: 40
    accept-count: 1000 # OS 레벨 대기열 크기
    max-connections: 10000
    connection-timeout: 20000

spring:
  application:
    name: homesweet-back
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/homesweet
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: user
    password: password
    hikari:
      maximum-pool-size: 120
      minimum-idle: 20
      connection-timeout: 2000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        highlight_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 30
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
            user-name-attribute: id
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 2000ms
  cache:
    type: redis
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

logging:
  level:
    com.homesweet.homesweetback: ERROR
    org.springframework.security: ERROR
    org.hibernate.SQL: ERROR
    org.springframework.batch: ERROR
    org.springframework.data.elasticsearch: ERROR
    org.elasticsearch.client: ERROR

# JWT 개발 환경 설정
jwt:
  secret: ${JWT_SECRET:homesweet-back-jwt-secret-key-for-development-only}
  access-token-expiration: 18000000   # 5시간
  refresh-token-expiration: 604800000 # 7일 

# OAuth2 개발 환경 설정
app:
  oauth2:
    redirect-uri: http://localhost:3000/login/callback
    redirect-uri-on-register: http://localhost:3000/signup/callback
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000

# 임시적으로 로그는 파일에 저장
log:
  config:
    error:
      path: logs/dev/error
      filename: application-dev-error
    trace:
      path: logs/dev/trace
      filename: trace
    maxHistory: 30
    totalSizeCap: 1GB

# 토스페이먼츠 설정
payments:
  toss:
    mock:
      enabled: false
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
    secretKey: ${TOSS_PAYMENTS_SECRET_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: homesweet-back
  prometheus:
    metrics:
      export:
        enabled: true
