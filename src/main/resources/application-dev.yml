server:
  port: 8080

spring:
  application:
    name: homesweet-back
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/homesweet
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: user
    password: password
    # HikariCP 커넥션 풀 최적화
    hikari:
      maximum-pool-size: 20           # 최대 커넥션 수
      minimum-idle: 10                # 최소 유휴 커넥션 수
      connection-timeout: 30000       # 커넥션 획득 타임아웃 (30초)
      idle-timeout: 600000            # 유휴 커넥션 타임아웃 (10분)
      max-lifetime: 1800000           # 커넥션 최대 수명 (30분)
      connection-test-query: SELECT 1
      pool-name: HikariCP-Community
      auto-commit: true
      # MySQL 최적화 설정
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # 배치 처리 최적화
        jdbc:
          batch_size: 50
          fetch_size: 100
        order_inserts: true
        order_updates: true
        # 쿼리 캐시 활성화
        cache:
          use_second_level_cache: false  # Redis로 대체
          use_query_cache: false
        # 성능 통계
        generate_statistics: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
            user-name-attribute: id
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20      # 최대 활성 커넥션
          max-idle: 10        # 최대 유휴 커넥션
          min-idle: 5         # 최소 유휴 커넥션
          max-wait: 3000ms    # 커넥션 대기 시간
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=5m,recordStats

logging:
  level:
    com.homesweet.homesweetback: DEBUG
    org.springframework.security: DEBUG

# JWT 개발 환경 설정
jwt:
  secret: ${JWT_SECRET:homesweet-back-jwt-secret-key-for-development-only}
  access-token-expiration: 18000000   # 5시간
  refresh-token-expiration: 604800000 # 7일 

# OAuth2 개발 환경 설정
app:
  oauth2:
    redirect-uri: http://localhost:3000/login/callback
    redirect-uri-on-register: http://localhost:3000/signup/callback
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000

# 임시적으로 로그는 파일에 저장
log:
  config:
    error:
      path: logs/dev/error
      filename: application-dev-error
    trace:
      path: logs/dev/trace
      filename: trace
    maxHistory: 30
    totalSizeCap: 1GB

# 토스페이먼츠 설정
payments:
  toss:
    secretKey: ${TOSS_PAYMENTS_SECRET_KEY:example-secret-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: homesweet-back
  prometheus:
    metrics:
      export:
        enabled: true

# Redisson 분산 락 설정
redisson:
  address: redis://localhost:6379
  password:
  database: 0

# ML 서비스 설정
ml-service:
  base-url: http://localhost:8000
  timeout: 10

