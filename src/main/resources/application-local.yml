spring:
  datasource:
    url: jdbc:mysql://localhost:3307/homesweettest?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6380
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile

toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY:test_sk_XXXX}
    client-key: ${TOSS_CLIENT_KEY:test_ck_XXXX}
    base-url: https://api.tosspayments.com/v1

logging:
  level:
    com.homesweet: DEBUG
    org.hibernate.SQL: DEBUG

jwt:
  secret: homesweet-local-test-jwt-secret-key-that-is-at-least-32-bytes-long
  access-token-expiration: 18000000
  refresh-token-expiration: 604800000

app:
  oauth2:
    redirect-uri: http://localhost:3000/login/callback
    redirect-uri-on-register: http://localhost:3000/signup/callback
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000

payments:
  toss:
    secretKey: ${TOSS_PAYMENTS_SECRET_KEY:test_sk_dummy_key}

search:
  elasticsearch:
    enabled: false
