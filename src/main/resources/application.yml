test:
  mode: true  # 부하 테스트 시 true, 프로덕션에서는 false

spring:
  application:
    name: homesweet-back
  profiles:
    active:
      - prod
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${AWS_S3_BUCKET}
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  datasource:
    hikari:
      maximum-pool-size: 80
      minimum-idle: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

server:
  tomcat:
    threads:
      max: 350                    # 워커 스레드 수(실제 요청 처리)
      min-spare: 50               # 최소 유지 스레드
    accept-count: 200             # acceptQueue 크기, 연결대기큐 / sommaxconn : 128
    max-connections: 10000        # 동시 연결 가능한 소켓 수
    connection-timeout: 30000


resilience4j:
  circuitbreaker:
    instances:
      toss-payments:
        registerHealthIndicator: true
        slidingWindowSize: 5           # 최근 5번 요청을 기록
        failureRateThreshold: 50       # 그 중 50%(즉 3번) 이상 실패하면 서킷 OPEN (차단)
        waitDurationInOpenState: 10s   # 차단 후 10초 동안은 무조건 요청 거부 (쉬는 시간)
        permittedNumberOfCallsInHalfOpenState: 3 # 10초 뒤 '반열림' 상태에서 3번만 테스트로 찔러봄
        automaticTransitionFromOpenToHalfOpenEnabled: true # 시간이 지나면 자동으로 반열림 상태로 전환

management:
  endpoints:
    web:
      exposure:
        include: health, circuitbreakers # health와 circuitbreakers 정보를 공개
  endpoint:
    health:
      show-details: always # 상세 정보 표시
  health:
    circuitbreakers:
      enabled: true # 서킷 브레이커 상태도 health에 포함

retry:
  instances:
    toss-payments-retry: # 재시도 설정 이름
      maxRetryAttempts: 3        # 최대 3번까지 시도 (최초 1회 + 재시도 2회)
      waitDuration: 500ms        # 재시도 사이의 간격 (0.5초)
      retryExceptions:           # 재시도할 예외 타입 (모든 에러를 다 재시도하진 않음)
        - java.io.IOException    # 네트워크 연결 오류
        - org.springframework.web.client.ResourceAccessException # 타임아웃 등
        - java.net.ConnectException
      # (옵션) 400 Bad Request 같은 건 재시도해도 소용없으니 제외
      ignoreExceptions:
        - org.springframework.web.client.HttpClientErrorException

# Community 도메인 설정
community:
  cache:
    post-ttl: 1h        # 게시글 단건 캐시 TTL
    list-ttl: 1m        # 게시글 목록 캐시 TTL
    comments-ttl: 30m   # 댓글 목록 캐시 TTL
  scheduler:
    view-sync-delay: 110000     # 조회수 동기화 주기 (ms)
    comment-sync-delay: 210000  # 댓글수 동기화 주기 (ms)
    like-sync-delay: 300000     # 좋아요 동기화 주기 (ms)
    warmup-delay: 3600000       # 캐시 워밍업 주기 (ms)
  redis:
    ttl: 7d             # Redis 카운터 TTL