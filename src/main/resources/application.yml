spring:
  application:
    name: homesweet-back
  profiles:
    active:
      - dev
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY:local-dummy-access-key}
        secret-key: ${AWS_SECRET_KEY:local-dummy-secret-key}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${AWS_S3_BUCKET:local-dummy-bucket}
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  datasource:
    hikari:
      maximum-pool-size: 30
      minimum-idle: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
  data:
    redis:
      host: 43.202.161.79
      port: 6379
      lettuce:
        pool:
          max-active: 100 # 동시에 사용할 수 있는 최대 연결 수
          max-idle: 50 # 유휴 상태로 유지할 연결 수
          min-idle: 10 # 최소 유지 연결 수
          max-wait: 3000ms # 연결을 얻기 위해 기다리는 최대 시간 3초

server:
  tomcat:
    threads:
      max: 200
      min-spare: 50
    accept-count: 5000
    max-connections: 10000
    connection-timeout: 20000


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

payments:
  toss:
    connect-timeout-ms: 2000
    read-timeout-ms: 5000

# Community 도메인 설정
community:
  cache:
    post-ttl: 1h        # 게시글 단건 캐시 TTL
    list-ttl: 1m        # 게시글 목록 캐시 TTL
    comments-ttl: 30m   # 댓글 목록 캐시 TTL
  scheduler:
    view-sync-delay: 110000     # 조회수 동기화 주기 (ms)
    comment-sync-delay: 210000  # 댓글수 동기화 주기 (ms)
    warmup-delay: 3600000       # 캐시 워밍업 주기 (ms)
  redis:
    ttl: 7d             # Redis 카운터 TTL

