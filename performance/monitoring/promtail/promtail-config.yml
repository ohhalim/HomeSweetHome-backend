server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ===== Spring Boot 애플리케이션 로그 =====
  - job_name: homesweet-backend

    # 로그 파일 위치
    static_configs:
      - targets:
          - localhost
        labels:
          job: homesweet-backend
          application: homesweet-back
          env: development
          __path__: /app/logs/**/*.log

    # 로그 파싱 파이프라인
    pipeline_stages:
      # 1. 정규식으로 로그 파싱
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\s+(?P<level>\w+)\s+(?P<thread>\[.*?\])\s+(?P<logger>[\w\.]+)\s+:\s+(?P<message>.*)'

      # 2. 타임스탬프 추출
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05.000'

      # 3. 로그 레벨 라벨 추가
      - labels:
          level:
          thread:
          logger:

      # 4. TraceId 추출 (로그에 TraceId가 있는 경우)
      - regex:
          source: message
          expression: 'TraceId=(?P<trace_id>[a-zA-Z0-9-]+)'

      - labels:
          trace_id:

      # 5. 커뮤니티 도메인 특정 로그 라벨 추가
      - match:
          selector: '{logger=~".*community.*"}'
          stages:
            - labels:
                domain: community

      # 6. 에러 로그에 추가 레이블
      - match:
          selector: '{level="ERROR"}'
          stages:
            - labels:
                alert: 'true'

  # ===== 시스템 로그 (syslog) =====
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /var/log/syslog

  # ===== Docker 컨테이너 로그 (선택사항) =====
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*.log

    pipeline_stages:
      # Docker JSON 로그 파싱
      - json:
          expressions:
            output: log
            stream: stream
            time: time

      - timestamp:
          source: time
          format: RFC3339Nano

      - labels:
          stream:

      - output:
          source: output
