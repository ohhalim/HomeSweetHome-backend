global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # EC2 Backend 서버의 Spring Boot Actuator 메트릭
  - job_name: 'spring-actuator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['13.209.72.206:8080']

  # EC2 Backend 서버의 Node Exporter (시스템 메트릭)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['13.209.72.206:9100']

  # EC2 Backend 서버의 MySQL Exporter
  - job_name: 'mysqld_exporter'
    static_configs:
      - targets: ['13.209.72.206:9104']