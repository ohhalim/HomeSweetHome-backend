global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # EC2 백엔드 서버 Spring Boot Actuator 메트릭
  - job_name: 'spring-actuator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['13.209.96.168:8080']

  # EC2 Node Exporter (백엔드 서버 자원)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['13.209.96.168:9100']
