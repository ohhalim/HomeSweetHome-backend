global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 로컬 Spring Boot Actuator 메트릭
  - job_name: 'spring-actuator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']  # 로컬 환경용

  # 로컬 Node Exporter (시스템 메트릭)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']  # 로컬 환경용

  # 로컬 MySQL Exporter
  - job_name: 'mysqld_exporter'
    static_configs:
      - targets: ['host.docker.internal:9104']  # 로컬 환경용
